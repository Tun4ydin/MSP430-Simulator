[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "msp430sim"
version = "0.1.0"
description = "Pure Python MSP430G2553 desktop simulator and two-pass assembler"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "yagizylldrm" }]
keywords = ["msp430", "simulator", "assembler", "emulator", "ti", "g2553"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Emulators",
]

[project.scripts]
msp430sim = "msp430sim.__main__:entry_point"

[tool.setuptools.packages.find]
where = ["."]
include = ["msp430sim*"]
